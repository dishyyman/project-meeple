    <!-- ================= HOME =================
         Two blocks under the title: the account card, then the four
         destinations as a single column.

         The account card holds BOTH states in the markup at once and lets
         CSS pick between them off data-account on .app — the same
         state-on-an-attribute pattern data-view and data-tab use. Nothing
         here is built or torn down on sign-in; the JS flips one attribute.
         There is no login flow behind it yet, and the name is a placeholder.
         ============================================================= -->
    <section class="screen screen--home">
      <div class="home">
        <h1 class="home__title">Home</h1>

        <!-- ---------- ACCOUNT ---------- -->
        <div class="account">
          <!-- Two avatars, one per state, picked by CSS off data-account — the
               same "both states live in the markup" pattern the bodies below
               use. They cannot be one shared glyph any more: the signed-in
               avatar carries a tick, and a single avatar would show that
               confirmation next to the words "Not signed in". -->
          <span class="account__avatar account__avatar--out" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          </span>
          <span class="account__avatar account__avatar--in" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="m16 19 2 2 4-4"/></svg>
          </span>

          <!-- Signed OUT. The button is deliberately small: signing in is
               optional and nothing on this screen needs it, so it should not
               compete with the four destinations below. -->
          <span class="account__body account__body--out">
            <span class="account__name">Not signed in</span>
            <span class="account__note">Sign in to sync across devices.</span>
          </span>
          <button class="account__btn" data-action="sign-in" type="button">Sign in</button>

          <!-- Signed IN. Name first, then the status beneath it — the name is
               what you look for, the tick only confirms it. The tick is part
               of the status line rather than a badge on the avatar so that
               the confirmation is READ as words; an icon alone leaves the
               player to infer what it means. -->
          <span class="account__body account__body--in">
            <span class="account__name" data-bind="accountName">John</span>
            <span class="account__status">
              <span class="account__check" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3 4.8 8.6 9.5 3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              Signed in
            </span>
          </span>
        </div>

        <!-- ---------- DESTINATIONS ---------- -->
        <!-- One column, in the order they are reached for: characters most
             often, settings least. Each row is a nav target, so each carries
             a chevron. -->
        <nav class="navlist">
          <button class="navcard" data-nav="characters">
            <span class="navcard__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
            </span>
            <span class="navcard__body"><span class="navcard__name">Characters</span></span>
            <span class="navcard__go" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </button>
          <button class="navcard" data-action="compendium">
            <span class="navcard__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M16 13h2"/><path d="M16 9h2"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/><path d="M6 13h2"/><path d="M6 9h2"/></svg>
            </span>
            <span class="navcard__body"><span class="navcard__name">Compendium</span></span>
            <span class="navcard__go" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </button>
          <button class="navcard" data-nav="campaigns">
            <span class="navcard__icon">
              <!-- Compass rose: the Game Master charts the session — encounters ahead,
                   NPCs tracked along the way. Reads as "plan the route", which is
                   what this screen is for, and stays legible at 22px. -->
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg>
            </span>
            <span class="navcard__body"><span class="navcard__name">Game Master Tools</span></span>
            <span class="navcard__go" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </button>
          <button class="navcard" data-nav="settings">
            <span class="navcard__icon">
              <!-- Gear: a notched outline plus the hub bore. The teeth are drawn
                   as one continuous curved path rather than radial spokes — at
                   22px spokes read as a ship's wheel, and the slanted flanks are
                   what make this machined rather than nautical. -->
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
            <span class="navcard__body"><span class="navcard__name">Settings</span></span>
            <span class="navcard__go" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
          </button>
        </nav>
      </div>
    </section>
