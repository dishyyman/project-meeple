    <!-- ================= MENU DRAWER ================= -->
    <div class="drawer">
      <div class="drawer__scrim" data-menu="close"></div>
      <div class="drawer__panel">
        <div class="drawer__head">
          <div class="drawer__title">Index</div>
          <button class="drawer__close" data-menu="close" aria-label="Close"></button>
        </div>
        <div class="divider"></div>
        <!-- Four groups, ruled apart, in the order a player reaches for them:
             who the character IS, what you do at the table, what you look up,
             and what you do to the app. Every entry is the same card button —
             one look for "a place this menu goes" — except Level Up, which
             stays filled as the drawer's one primary action.

             Six of these have nothing behind them yet. They are inert rather
             than disabled, which is what Rulebook and Compendium already were:
             a menu greyed out six ways reads as broken, and the destinations
             are real, only unbuilt. `data-action` names match the home
             screen's, so both routes land in one place once they exist. -->
        <div class="drawer__body">
          <div class="drawer__group">
            <button class="levelup-btn" data-action="level-up">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
              <span>Level Up</span>
            </button>
            <!-- Directly beneath Level Up: both change who the character IS,
                 as opposed to the groups below, which change what you read. -->
            <button class="drawer-btn" data-nav="edit">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
              <span>Edit Character</span>
            </button>
          </div>

          <div class="divider"></div>
          <div class="drawer__group">
            <!-- A bed, not a crescent: a rest is somewhere you go rather than a
                 time of day, and the moon read as "dark mode" beside a Settings
                 entry that now owns that picture. -->
            <button class="drawer-btn" data-action="rest">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/><path d="M3 18h18"/></svg>
              <span>Rest</span>
            </button>
            <button class="drawer-btn" data-tab="notes">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M16 2v20"/></svg>
              <span>Notes</span>
            </button>
            <!-- The import glyph mirrored — arrow out of the tray against
                 arrow into it — because they are the same door both ways. -->
            <button class="drawer-btn" data-action="share">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/></svg>
              <span>Share</span>
            </button>
          </div>

          <div class="divider"></div>
          <div class="drawer__group">
            <!-- The home screen's open book, so one destination has one face. -->
            <button class="drawer-btn" data-action="compendium">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16"/><path d="M16 13h2"/><path d="M16 9h2"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/><path d="M6 13h2"/><path d="M6 9h2"/></svg>
              <span>Compendium</span>
            </button>
            <!-- A scroll, not a second book: the Compendium is the open one,
                 and two books side by side would be one icon twice. -->
            <button class="drawer-btn" data-nav="rules">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="3.5" rx="1.75"/><rect x="4" y="18" width="16" height="3.5" rx="1.75"/><path d="M6 6h12v12H6z"/><path d="M9 9.5h6"/><path d="M9 13h4"/></svg>
              <span>Rules</span>
            </button>
          </div>

          <div class="divider"></div>
          <div class="drawer__group">
            <!-- The home screen's gear, for the same reason as the book.
                 data-nav rather than data-action, so the navigation branch
                 closes the drawer on the way out — the same path the Rules
                 entry above takes. -->
            <button class="drawer-btn" data-nav="settings">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
              <span>Settings</span>
            </button>
            <button class="drawer-btn" data-action="help">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              <span>Help</span>
            </button>
          </div>
        </div>
      </div>
    </div>
