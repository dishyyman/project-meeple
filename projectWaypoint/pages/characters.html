    <!-- ================= CHARACTERS LIST ================= -->
    <section class="screen screen--characters">
      <div class="topbar topbar--between">
        <button class="icon-btn icon-btn--back" data-nav="home" aria-label="Back">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="title">Characters</h2>
        <!-- The standard list-edit affordance: one text button that swaps
             label with the mode it toggles. Its text is written by
             renderRoster() so "Edit" and "Done" cannot drift out of step with
             data-roster on .app. -->
        <button class="text-btn" data-roster-edit data-bind="rosterEdit"></button>
      </div>
      <div class="divider"></div>
      <div class="section-pad">
        <!-- Shown only while the roster is empty — renderRoster() hides the
             block once there is a character to list, because by then the list
             itself says everything this line was standing in for. Static copy:
             it only ever has one thing to say, so it lives here rather than
             being written by JS. -->
        <p class="roster-lead" data-block="rosterLead">
          Your party is empty. Click below to create a new character or import one from a file.
        </p>
        <!-- One row per character in the roster, painted by renderRoster().
             Empty in the markup because the count is not known until the
             saves are read. -->
        <div data-list="roster"></div>
        <!-- btn-dashed--lead takes the accent, but ONLY while the roster is
             empty (see characters.css) — trailing a list of characters this is
             an afterthought, and with nothing above it it is the whole point of
             the screen. One button either way: the action does not change, so
             neither does the markup. -->
        <button class="btn-dashed btn-dashed--lead" data-action="create-character">
          <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Create Character</span>
        </button>
        <!-- Import is a peer of Create, not an edit-mode action: you reach for
             it when you have no character yet, which is exactly when edit mode
             has nothing to edit. -->
        <button class="btn-dashed" data-import-open>
          <!-- The conventional import glyph: an arrow dropping into an
               open-topped tray. Stroke 2 rather than the house 1.5 because
               .btn-dashed__icon pins the bed to 16px while the artwork is
               drawn on 24 — at 1.5 the downscale would render it near 1px and
               it would read as hairline beside the label. Its Create sibling
               is compensated the same way, so the pair match. -->
          <svg class="btn-dashed__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Import Character</span>
        </button>
        <!-- The picker itself. Kept out of view rather than display:none, so
             the click that opens it is a real user gesture in every browser. -->
        <input class="visually-hidden" type="file" data-import-file
               accept=".json,application/json" aria-label="Choose a Waypoint character file">
      </div>
    </section>
