<!DOCTYPE html>
<html lang="en" data-frame="phone">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app paint edge to edge on a notched
       iPhone instead of being letterboxed inside the safe area. That is only
       safe because the app then reads the real insets back through
       env(safe-area-inset-*) — see --statusbar-clear and --home-clear in
       tokens.css. Zoom is deliberately left enabled (accessibility). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Home-screen app. The manifest (name, icons, standalone display) is
       what Android and current iOS read; the apple-* tags are what older
       iOS reads, and the only way to set the status bar style on iOS.
       "black", an opaque bar, and NOT black-translucent: on iOS 26 a
       home-screen app drawn under a translucent status bar is given a
       viewport about one status-bar height (~60pt) too short, and iOS
       paints nothing in the strip left at the bottom — it covered the tab
       bar's labels, and no CSS can reach it (tried: 100vh in standalone).
       With an opaque bar the app starts below the clock and runs to the
       bottom edge. Do not switch it back without testing on a device.
       The manifest loads under default-src 'self' in the policy below —
       no new source is needed. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#232323">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meeple">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/images/icons/favicon-32.png">

  <!-- Content Security Policy — the backstop behind esc() (docs/security.md).
       If an escaping bug ever let markup from an imported file onto the page,
       this is what stops it from RUNNING: scripts load only from this site,
       and inline <script>, inline handlers (onclick="…") and eval() are all
       refused. The app uses none of them, which is what makes a policy this
       strict possible.
         style-src  this site + the Google Fonts stylesheet. No inline style
                    attributes — JS sets custom properties through the CSSOM
                    (el.style.setProperty), which this does not block.
         font-src   the font files Google Fonts serves.
         img-src    data: for portraits (stored as data URLs) and the CSS
                    status glyphs; blob: for photos being cropped.
         connect-src this site only — boot.js fetching pages/.
       Changing a source here is a security decision: record it in
       docs/security.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Meeple — Character</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=MedievalSharp&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- All appearance lives in the stylesheet; swap this file to re-skin.
       style.css is an index of @imports — see the note at its top. -->
  <link rel="stylesheet" href="resources/css/style.css">

  <!-- Loaded here, before first paint: it applies the stored frame mode to
       the root element synchronously, so a player who chose full window never sees
       the phone shell paint and snap away. Wiring the button waits for
       DOMContentLoaded; only the attribute is urgent. -->
  <script src="resources/js/frame.js"></script>
</head>
<body>

<!-- =====================================================================
     SHELL ONLY.

     Every screen and modal lives in its own file under pages/ and is
     stitched into .app at runtime by boot.js. If you are looking for the
     character sheet markup, it is pages/sheet.html — not here.

     Because the markup is assembled with fetch(), this page must be
     served over http:// (VS Code Live Server, or any static server).
     Opening the file directly will show a boot error explaining that.
     ===================================================================== -->

<!-- Phone frame -->
<div class="device">
  <div class="device__notch"></div>
  <div class="device__statusbar">
    <span>9:41</span>
    <span class="device__signal">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="3" width="16" height="6" rx="1" fill="currentColor"/><rect x="23.5" y="4" width="1.5" height="4" rx="0.75" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- ============================================================
       APP ROOT — view/tab/menu/modal state carried on data-* attrs.
       JS flips these attributes; CSS decides what shows.
       Screens are injected here by boot.js, in the order listed in
       its PAGES array.
       ============================================================ -->
  <!-- data-view starts at "home" to match what init() sets once the screens are
       in. The two have to agree: this attribute is what paints during the moment
       between boot.js injecting the markup and main.js running, so a different
       value here shows that screen and snaps away. -->
  <!-- data-edit-tab is the Edit screen's OWN tab state, deliberately not the
       data-tab the sheet uses: leaving the editor resets data-tab to "action"
       (see the data-nav handler in main.js), and sharing one attribute would
       let a choice made in the editor decide which sheet tab you land on. -->
  <div class="app" data-view="home" data-tab="character" data-edit-tab="dossier" data-menu="closed" data-modal="closed" data-account="out"></div>

</div><!-- /.device -->

<!-- Shell chrome, outside .app on purpose: main.js owns the delegated
     handler inside the app, and how the app is housed is not its business.
     frame.js wires this directly. -->
<button class="frame-toggle" data-frame-toggle type="button" aria-pressed="false">
  <span class="frame-toggle__icon" aria-hidden="true"></span>
  <span data-frame-label>Full</span>
</button>

<!-- boot.js first: it defines MEEPLE_READY, which main.js waits on
     instead of DOMContentLoaded. The two engines (dice, mechanics) and the
     generated game content all load before main.js, which reads the
     globals they declare.
     Regenerate content with: node tools/csv-to-json.mjs -->
<script src="resources/js/boot.js"></script>
<script src="resources/js/dice.js"></script>
<script src="resources/js/mechanics.js"></script>
<script src="resources/js/portrait.js"></script>
<script src="resources/js/library.js"></script>
<script src="resources/js/library-check.js"></script>
<!-- After dice, mechanics and library-check: campaign.js borrows the dice
     engine, the health floor and the content-id rule from them. -->
<script src="resources/js/campaign.js"></script>
<script src="resources/js/rules.js"></script>
<script src="resources/js/main.js"></script>
</body>
</html>
